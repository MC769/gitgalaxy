[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gitgalaxy"
version = "0.1.0"
description = "Turn any git repo's commit history into an animated starfield in your terminal."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
keywords = ["git", "cli", "terminal", "visualization", "ascii-art"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "rich>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/MC769/gitgalaxy"
Repository = "https://github.com/MC769/gitgalaxy"

[project.scripts]
gitgalaxy = "gitgalaxy.cli:main"

[tool.setuptools.packages.find]
include = ["gitgalaxy*"]
